name: coderouter verify release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: CodeRouter release tag to verify
        required: true
        type: string

permissions: {}

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'coderouter-v')
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    steps:
      # Every workflow shares one installation API budget an hour; a spent budget used to
      # fail this job on its first gh call (cmuxterm-hq#12082, run 43888568476). The wrapper
      # waits for the reset instead, bounded by an hour. On a ref older than the wrapper
      # both steps carry on, and gh fails on a spent budget as it did before.
      - name: Checkout the gh rate-limit wait
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci/gh_budget_wait.sh
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits in this job's gh calls
        continue-on-error: true
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Download immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^coderouter-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "$TAG" --dir dist
          (cd dist && sha256sum --check SHA256SUMS)
          jq -e \
            --arg version "${TAG#coderouter-v}" \
            --arg tag "$TAG" \
            '.version == $version and .source_tag == $tag' \
            dist/manifest.json
      - name: Smoke-test Linux binary
        run: |
          set -euo pipefail
          chmod 0755 dist/coderouter-linux-x64
          dist/coderouter-linux-x64 --version
