name: coderouter publish pypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable X.Y.Z CodeRouter release version
        required: true
        type: string

permissions: {}

concurrency:
  group: coderouter-publish-pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest # github-hosted-required: PyPI trusted publishing needs a GitHub-hosted runner
    environment:
      name: pypi-coderouter
      url: https://pypi.org/project/coderouter/
    permissions:
      contents: read
      id-token: write
    steps:
      # Every workflow shares one installation API budget an hour; a spent budget used to
      # fail this job on its first gh call (cmuxterm-hq#12082, run 43888568476). The wrapper
      # waits for the reset instead, bounded by an hour. On a ref older than the wrapper
      # both steps carry on, and gh fails on a spent budget as it did before.
      - name: Checkout the gh rate-limit wait
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .gh-budget-tooling
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/ci/gh_budget_wait.sh
          sparse-checkout-cone-mode: false
      - name: Wait through GitHub API rate limits in this job's gh calls
        continue-on-error: true
        run: bash .gh-budget-tooling/scripts/ci/gh_budget_wait.sh --install

      - name: Download verified wheels
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "coderouter-v$VERSION" \
            --pattern 'coderouter-*.whl' \
            --pattern SHA256SUMS \
            --dir dist
          (
            cd dist
            grep 'coderouter-.*\.whl$' SHA256SUMS | sha256sum --check
          )
          [[ "$(find dist -name 'coderouter-*.whl' | wc -l)" -eq 5 ]]
          rm dist/SHA256SUMS
      - name: Publish through PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          attestations: true
